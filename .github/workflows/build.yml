name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-i686
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GTAIV.ProperGrass
          path: build/GTAIV.ProperGrass.asi
