; GTA IV Proper Grass - settings (read when the game starts)
[Main]
Enabled=1

; Active plant triangles (original game: 512). Dense parks need a high value.
TriCapacity=16384
; Upper limit of instanced plants drawn per frame.
MaxInstances=60000

; Plant radius = (20 + 0.5 * Detail Distance) * RadiusMultiplier. Plants grow in over the last FadeWidth metres.
RadiusMultiplier=1.5
FadeWidth=12
; Fixed draw radius in metres (0 = use the radius above).
DrawDistance=0
; Multiplies the spacing-based density of all vegetation (1.0 = procedural.dat).
DensityMultiplier=1.0
; Size of all plants (width and height), 1.0 = original. Range 0.25 - 3.0.
PlantScale=1.0

; Materials whose polygons get vegetation, as NAME@TAG (tags are the names used in procedural.dat).
; The game ships these grass surfaces without any plants.
GrassMaterials=GRASS@EXT_GRASS_DRYPLANTS_SHORT,SHORT_GRASS@EXT_GRASS_DRYPLANTS_SHORT,GRASS_PATCHY@EXT_GRASS_DRYPLANTS_SHORT,GRASS_LONG@EXT_GRASS_DRYPLANTS_LONG
; Plants closer than EdgeMargin metres to the border of a grass area are removed, and shrink over the next EdgeSoft metres.
EdgeMargin=0.35
EdgeSoft=1.0

; Plants outside the camera's view cone are not drawn (saves GPU time).
FrustumCull=1

; --- Diagnostics (leave off for normal play) ---
; Debug=1 writes extra statistics to ProperGrass.log
Debug=0
; Profile=1 shows an on-screen performance panel and writes [perf] lines to ProperGrass.log.
; ToggleKey cycles MOD -> VANILLA -> NO-INSTANCING (1/2/3 beeps), CullKey toggles FrustumCull.
; Keys are virtual-key codes, e.g. 0x76 = F7, 0x77 = F8. 0 = disabled.
Profile=0
ToggleKey=0
CullKey=0
